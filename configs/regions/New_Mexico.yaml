# New Mexico region config for met-data-products' crop step.
#
# Maintained via compute_and_write_region_crop.py --update-config, which round-trips
# this file through ruamel.yaml specifically so this header (and any future
# comments) survive future updates -- see New_York.yaml's header for why
# that note exists.
#
# Unlike New_York.yaml, nothing here records existing production data --
# New Mexico hasn't been processed yet, so every grid.<product> entry below
# is a genuine tool-derived computation, not a read of a real already-cropped
# file.
#
# grid.URMA computed via --mode boundary (real GADM boundary, not
# hand-picked):
#   python compute_and_write_region_crop.py --product URMA --grid-source URMA/urma_full_orography.nc \
#       --mode boundary --state "New Mexico" --padding 10 \
#       --region-config configs/regions/New_Mexico.yaml --update-config
#
# Every other grid.<product> entry computed via --mode reference, matched to
# grid.URMA's crop above with a 1-degree halo (ICON's is a saved boolean
# cell mask under configs/regions/masks/, not an index window -- unstructured
# mesh, same as New York's).
#
# grid.Ouranos additionally carries a bbox field (lat_min/lat_max/lon_min/
# lon_max) -- the real-world extent of the selected index window, computed
# with --round32 for DL-compatible sizing (n0=n1=128, not the un-rounded
# 108x109). This is what download_ouranos.py/download_fx.py actually read
# for New Mexico's downloads: Ouranos has no local index-crop step, its real
# crop happens via a THREDDS NCSS bbox param in the download request, so the
# index crop above is theoretical/unused and the bbox is the operative
# value. Contrast with New_York.yaml's grid.Ouranos.bbox, which is
# deliberately NOT this same derivation -- see that file's header.
#
# Note n0(y)=288 here, not New York's n0(y)=256 -- New Mexico is a taller
# domain at URMA's native resolution (its state bbox is closer to square
# than New York's east-west-elongated shape). This is a real, confirmed
# difference, not a guess: DL_downscaling/configs/baseline.yaml's
# original_output_size (currently a flat, non-region-templated [256,288])
# will need to become region-aware before New Mexico training configs can
# use this domain size.
region_id: new_mexico
data_root: /network/rit/lab/basulab/Harish/Climate-Downscaling_data
region_tag: NMS
boundary:
  gadm_file: /network/rit/lab/basulab/Harish/ResearchOS/Projects/Active/Sparse-to-grided-deep-interpolation/git_repos/Sparse_to_dense_meteorological_variables/data/geospatial/gadm_410.gpkg
  country: United States
  state: New Mexico
  buffer_m: 5000
grid:
  URMA:
    type: curvilinear
    dims:
    - y
    - x
    inner:
      n0: 288
      n1: 288
      crop:
        y_start: 381
        x_start: 751
      bbox:
        lat_min: 30.676473
        lat_max: 37.629833
        lon_min: -110.055841
        lon_max: -101.637078
    outer:
      n0: 512
      n1: 480
      crop:
        y_start: 282
        x_start: 642
      bbox:
        lat_min: 28.15411
        lat_max: 40.473092
        lon_min: -113.554601
        lon_max: -99.351203
  HRRR:
    type: curvilinear
    dims:
    - y
    - x
    n0: 500
    n1: 481
    crop:
      y_start: 143
      x_start: 367
    bbox:
      lat_min: 26.919412
      lat_max: 41.53005
      lon_min: -116.385889
      lon_max: -99.071175
  ERA5:
    type: separable
    dims:
    - latitude
    - longitude
    n0: 52
    n1: 60
    crop:
      latitude_start: 197
      longitude_start: 984
    bbox:
      lat_min: 28.0
      lat_max: 40.75
      lon_min: -114.0
      lon_max: -99.25
  EDDEv2:
    type: curvilinear
    dims:
    - y
    - x
    n0: 127
    n1: 123
    crop:
      y_start: 129
      x_start: 108
    bbox:
      lat_min: 26.746948
      lat_max: 41.660564
      lon_min: -116.648315
      lon_max: -98.872803
  Ouranos:
    type: curvilinear
    dims:
    - rlat
    - rlon
    n0: 128
    n1: 128
    crop:
      rlat_start: 129
      rlon_start: 169
    bbox:
      lat_min: 26.444589
      lat_max: 42.015988
      lon_min: -117.266278
      lon_max: -98.586793
  ICON:
    type: unstructured
    dims:
    - cell
    n_selected: 11794
    cell_mask_file: configs/regions/masks/new_mexico_ICON_cell_mask.nc
