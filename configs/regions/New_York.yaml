# New York region config for met-data-products' crop step (URMA/HRRR/ERA5/ICON/
# EDDEv2/Ouranos process_and_write_to_zarr.py scripts).
#
# Maintained via compute_region_crop.py --update-config, which round-trips
# this file through ruamel.yaml specifically so this header (and any future
# comments) survive future updates -- plain yaml.safe_load/dump silently
# stripped it across Step 4's six updates the first time, which is why this
# note exists at all.
#
# grid.<product> is a per-product crop against that product's own native
# grid (see compute_region_crop.py --mode boundary for URMA, --mode
# reference or --mode bbox for everything else, which gets xESMF-regridded
# onto URMA's grid regardless of its own crop). ICON's entry is a saved
# boolean cell mask (configs/regions/masks/), not an index window -- its
# native grid is an unstructured mesh with no rectangular structure to slice.
#
# URMA/HRRR/ERA5/EDDEv2/ICON below are EXACT, verified reproductions of
# what's already in production use -- not reconstructed by reading a real
# cropped file's own lat/lon min/max and treating that as "the bbox that
# produced it". That approach was tried first and is WRONG for anything on a
# curvilinear/projected grid (HRRR, EDDEv2): a rectangular bbox drawn around
# an already-cropped curvilinear region is inherently wider than the crop
# itself, since the crop isn't axis-aligned in lat/lon space to begin with
# (confirmed: reconstructing HRRR's crop this way gave 611x574 against the
# real 452x459). It even affects separable grids (ERA5) via a smaller
# off-by-one: manual >=/<= masking doesn't reproduce xarray's .sel()
# inclusive-boundary behavior exactly. Fixed by instead replicating each
# script's OWN current exact logic once (literal indices for
# URMA/EDDEv2, the same compute_crop_slices/.sel() computation for
# HRRR/ERA5, the real icon_global_nys_mask.nc copied directly for ICON) and
# verifying the result reproduces the real file/mask exactly before trusting
# it -- see conversation history for the specific verification run per
# product, not just asserted here.
#
# grid.Ouranos is the one deliberate exception, in two ways:
#
# 1. Ouranos's real production crop isn't a local file crop at all --
#    process_and_write_to_zarr.py does no spatial subsetting; the crop
#    happens in download_ouranos.py, where a bbox (north/south/west/east) is
#    passed into the THREDDS NCSS download request URL. So grid.Ouranos.crop/
#    n0/n1 above (an index window against ouranos_full_orography.nc, from
#    --mode reference against URMA's domain with a 1-degree halo) is a
#    theoretical derivation only -- nothing in Ouranos's pipeline applies it
#    locally, and it was never validated against real data (see point 2).
#
# 2. grid.Ouranos.bbox -- the field download_ouranos.py/download_fx.py
#    actually read -- is DELIBERATELY NOT the output of that same --mode
#    reference/--round32 derivation for New York. ~300GB of real Ouranos_NYS
#    data already exists (raw downloads + processed Zarr + 2 regridded Zarr
#    products) built from the historical arbitrary bbox {38-48N,-82,-68E}
#    (0-360: north=48,south=38,west=278,east=292), whose real downloaded
#    shape (rlat=113,rlon=116) doesn't even match this file's own
#    grid.Ouranos.n0/n1 (113,113) -- confirming that index entry was never
#    checked against reality. So grid.Ouranos.bbox here is set to EXACTLY
#    reproduce that historical bbox, to avoid making future incremental
#    downloads/reprocessing diverge from the ~300GB already on disk. New
#    Mexico's grid.Ouranos.bbox, by contrast, IS the properly-derived,
#    --round32 DL-compatible --mode reference output, since no real
#    production data exists yet there to protect. Don't swap New York's
#    bbox for the properly-derived one without a deliberate, separate
#    decision to redownload/reprocess all of Ouranos_NYS.
#
# grid.URMA specifically: running --mode boundary --state "New York" against
# the same GADM boundary produces a LARGER superset (y_start=811, x_start=
# 1781, n0=288, n1=320) that fully contains this crop with margin on every
# side -- confirms the method is sound, but deliberately NOT swapped in:
# doing so would change URMA_NYS.zarr's shape and break compatibility with
# every already-trained model and already-written zarr product built
# against the current 256x288 domain (original_output_size in
# DL_downscaling/configs/baseline.yaml). Don't regenerate NY's data to match
# the auto-computed crop without a deliberate, separate decision to do so.
region_id: new_york
data_root: /network/rit/lab/basulab/Projects/DFS/DATA
region_tag: NYS
boundary:
  gadm_file: /network/rit/lab/basulab/Harish/ResearchOS/Projects/Active/Sparse-to-grided-deep-interpolation/git_repos/Sparse_to_dense_meteorological_variables/data/geospatial/gadm_410.gpkg
  country: United States
  state: New York
  buffer_m: 5000
grid:
  URMA:
    type: curvilinear
    dims:
    - y
    - x
    n0: 256
    n1: 288
    crop:
      y_start: 830
      x_start: 1800
  HRRR:
    type: curvilinear
    dims:
    - y
    - x
    n0: 452
    n1: 459
    crop:
      y_start: 549
      x_start: 1288
  ERA5:
    type: separable
    dims:
    - latitude
    - longitude
    n0: 41
    n1: 57
    crop:
      latitude_start: 168
      longitude_start: 1112
  EDDEv2:
    type: curvilinear
    dims:
    - y
    - x
    n0: 112
    n1: 114
    crop:
      y_start: 231
      x_start: 339
  Ouranos:
    type: curvilinear
    dims:
    - rlat
    - rlon
    n0: 113
    n1: 113
    crop:
      rlat_start: 229
      rlon_start: 397
    bbox:
      lat_min: 38.0
      lat_max: 48.0
      lon_min: -82.0
      lon_max: -68.0
  ICON:
    type: unstructured
    dims:
    - cell
    n_selected: 7084
    cell_mask_file: configs/regions/masks/new_york_ICON_cell_mask.nc
